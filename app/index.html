<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Sunset Cover Studio</h1>
    <p class="tagline">Your photo, a caption, a poster. Three steps to a PNG.</p>

    <div class="step"><span class="num">1</span><div>
      <label class="filelabel">Add your photos
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div id="tray" class="tray" aria-label="Photos"></div>
      <p class="hint">Click a photo to put it in the selected panel. Samples included.</p>
    </div></div>

    <div class="step"><span class="num">2</span><div>
      <p class="group-label">Layout</p>
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-layout="solo">Solo</button>
        <button type="button" data-layout="duo">Duo</button>
        <button type="button" data-layout="trio" class="on">Trio</button>
        <button type="button" data-layout="quad">Quad</button>
      </div>
      <p class="group-label">Colour grade</p>
      <div class="seg" role="group" aria-label="Colour grade">
        <button type="button" data-grade="sunset" class="on">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="noir">Noir</button>
      </div>
      <p class="group-label">Export size</p>
      <div class="seg" role="group" aria-label="Export size">
        <button type="button" data-size="square">1080 &times; 1080</button>
        <button type="button" data-size="portrait">1080 &times; 1350</button>
        <button type="button" data-size="wide" class="on">1920 &times; 1080</button>
      </div>
      <p class="hint">Click a panel to select it, drag to move its photo, scroll to zoom.</p>
      <p id="panellabel" class="panel" role="status">Panel 1 of 3</p>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
    </div></div>

    <div class="step"><span class="num">3</span><div>
      <label>Caption <input id="caption" type="text" maxlength="40" value="NEON NIGHTS"></label>
      <label>Sub-caption <input id="subcaption" type="text" maxlength="40" placeholder="optional"></label>
      <label>Caption size <input id="captionsize" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>
      <p class="group-label">Caption colour</p>
      <div class="swatches" role="group" aria-label="Caption colour">
        <button type="button" data-color="#ffffff" class="on" style="--c:#ffffff" aria-label="White"></button>
        <button type="button" data-color="#ff5ea8" style="--c:#ff5ea8" aria-label="Pink"></button>
        <button type="button" data-color="#4de3ff" style="--c:#4de3ff" aria-label="Cyan"></button>
        <button type="button" data-color="#ffd166" style="--c:#ffd166" aria-label="Yellow"></button>
      </div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </div></div>
  </section>
  <section class="stage" aria-label="Live preview">
    <canvas id="cover" width="900" height="506" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
